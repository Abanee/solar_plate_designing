<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Modern home with rooftop solar panels at sunrise</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4E2B8"/>
      <stop offset="45%" stop-color="#F2C87A"/>
      <stop offset="100%" stop-color="#E7D9A8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3A27"/>
      <stop offset="100%" stop-color="#153D2A"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFAF4"/>
      <stop offset="100%" stop-color="#EDEBDD"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1260" cy="230" r="110" fill="#F2C644" opacity="0.9"/>
  <circle cx="1260" cy="230" r="170" fill="#F2C644" opacity="0.18"/>
  <!-- ground -->
  <rect x="0" y="760" width="1600" height="240" fill="#E4E6D6"/>
  <!-- house body -->
  <rect x="470" y="470" width="660" height="300" fill="url(#wall)" stroke="#111714" stroke-opacity="0.06"/>
  <!-- roof -->
  <polygon points="440,470 800,270 1160,470" fill="#2B2E2A"/>
  <polygon points="470,462 800,300 1130,462" fill="#20221F"/>
  <!-- solar panels on roof -->
  <g stroke="#3E963F" stroke-width="3">
    <polygon points="520,452 800,318 800,360 550,470" fill="url(#panel)"/>
    <polygon points="810,318 1080,452 1050,470 810,360" fill="url(#panel)"/>
  </g>
  <g stroke="#69C34B" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="600" y1="410" x2="620" y2="450"/>
    <line x1="660" y1="382" x2="680" y2="424"/>
    <line x1="720" y1="352" x2="738" y2="396"/>
    <line x1="900" y1="352" x2="882" y2="396"/>
    <line x1="960" y1="382" x2="944" y2="424"/>
    <line x1="1020" y1="410" x2="1004" y2="450"/>
  </g>
  <!-- windows -->
  <rect x="520" y="560" width="120" height="150" rx="4" fill="#DCE9F4" stroke="#111714" stroke-opacity="0.15"/>
  <rect x="680" y="560" width="120" height="150" rx="4" fill="#F6E9C7" stroke="#111714" stroke-opacity="0.15"/>
  <rect x="840" y="590" width="220" height="120" rx="4" fill="#DCE9F4" stroke="#111714" stroke-opacity="0.15"/>
  <rect x="1010" y="560" width="90" height="150" rx="4" fill="#F6E9C7" stroke="#111714" stroke-opacity="0.15"/>
  <!-- door -->
  <rect x="742" y="620" width="70" height="150" rx="3" fill="#0B3A27"/>
  <!-- landscaping -->
  <circle cx="440" cy="760" r="55" fill="#3E963F" opacity="0.85"/>
  <rect x="430" y="760" width="20" height="60" fill="#59615B"/>
  <circle cx="1170" cy="750" r="40" fill="#3E963F" opacity="0.8"/>
  <rect x="1162" y="750" width="16" height="50" fill="#59615B"/>
  <rect x="330" y="820" width="940" height="16" fill="#D8DACB"/>
</svg>
