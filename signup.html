<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — SolarBright Rooftop Energy</title>
<meta name="description" content="Create your SolarBright account to track rooftop solar installation progress, request engineering audits, and view warranty documentation.">
<link rel="icon" type="image/png" href="assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function(){
    var t = localStorage.getItem("solarbright-theme") || localStorage.getItem("theme") || "light";
    var d = localStorage.getItem("solarbright-dir") || localStorage.getItem("dir") || "ltr";
    document.documentElement.setAttribute("data-theme", t);
    document.documentElement.setAttribute("dir", d);
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="light" class="page-auth">

<!-- FLOATING TOP-RIGHT THEME & RTL CONTROLS -->
<div class="auth-floating-actions">
  <button class="rtl-toggle" id="rtlToggle" aria-label="Toggle RTL / LTR layout" title="Toggle RTL / LTR layout">
    <span class="rtl-label">LTR</span>
  </button>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
  </button>
</div>

<main id="auth-main">
  <section class="auth-section">
    <div class="container">
      <div class="auth-card-wrapper">
        <div class="auth-card">
          <div class="auth-header text-center">
            <a href="index.html" class="auth-brand-logo">
              <img src="assets/images/logo.png" alt="SolarBright Logo" class="brand-logo-img">
              <span class="brand-text">
                <span class="brand-name">Solar<strong>Bright</strong></span>
                <span class="brand-tag">Architectural Energy</span>
              </span>
            </a>
            <h1 class="auth-title">Join SolarBright</h1>
            <p class="auth-subtitle">Get instant access to rooftop assessments, system plans, and subsidy tracking.</p>
          </div>

          <!-- SIGN UP FORM -->
          <form id="signupForm" class="auth-form" onsubmit="event.preventDefault();">
            <div class="form-field">
              <label for="signupName">Full Name <span>*</span></label>
              <input type="text" id="signupName" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-field">
              <label for="signupEmail">Email Address <span>*</span></label>
              <input type="email" id="signupEmail" placeholder="e.g. rahul@example.com" required>
            </div>

            <div class="form-field">
              <label for="signupPhone">Phone Number <span>*</span></label>
              <input type="tel" id="signupPhone" placeholder="e.g. +91 98765 43210" required>
            </div>

            <div class="form-field">
              <label for="signupPassword">Password <span>*</span></label>
              <div class="password-input-wrapper">
                <input type="password" id="signupPassword" placeholder="Min. 8 characters" minlength="8" required>
                <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">
                  <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>

            <div class="form-field">
              <label for="confirmPassword">Confirm Password <span>*</span></label>
              <div class="password-input-wrapper">
                <input type="password" id="confirmPassword" placeholder="Re-enter password" minlength="8" required>
              </div>
            </div>

            <div class="auth-options-row">
              <label class="custom-checkbox">
                <input type="checkbox" id="termsAgreement" required>
                <span class="checkmark"></span>
                <span class="label-text">I agree to SolarBright's <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a></span>
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block auth-submit-btn" id="signupSubmitBtn">
              Create Account →
            </button>

            <div class="auth-alert success" id="signupSuccessAlert" style="display:none;">
              ✓ Account created successfully! Redirecting to login...
            </div>
          </form>

          <!-- THIRD PARTY SIGNUP BUTTONS REARRANGED AFTER SUBMIT BUTTON -->
          <div class="auth-divider">
            <span>OR SIGN UP WITH SOCIAL</span>
          </div>

          <div class="social-auth-grid">
            <button type="button" class="btn-social btn-google" id="googleSignupBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Sign up with Google</span>
            </button>

            <button type="button" class="btn-social btn-apple" id="appleSignupBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.97.99-3.12-1 .04-2.2.67-2.9 1.49-.63.73-1.18 1.91-1.03 3.03 1.12.09 2.26-.57 2.94-1.4"/>
              </svg>
              <span>Sign up with Apple</span>
            </button>
          </div>

          <div class="auth-footer text-center">
            <p>Already have an account? <a href="login.html" class="auth-switch-link">Log In Here</a></p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
